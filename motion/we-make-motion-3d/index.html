// ═══ 3D · renderer, render targets and the post chain ════════════
// scene A ─┐
// scene B ─┼─ matte (noise-edged, glowing seam) ─ HDR ─ bloom ─ grade ─┐
// mask   ──┘                                                          ├─ accumulate (motion blur) ─ finish (grain, dust, weave)
//                                                             HUD ────┘
const G3 = { w: 0, h: 0 };
const lin = hex => new THREE.Color(hex).convertSRGBToLinear();
const hdr = (hex, k) => lin(hex).multiplyScalar(k);

const VS = 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0., 1.); }';
const NOISE = `
  float hash(vec2 p){ p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
  // precision-safe hash for large coordinates (grain): scales down before fract, so no striping at 4K
  float hashF(vec2 p){ vec3 q = fract(vec3(p.xyx) * .1031); q += dot(q, q.yzx + 33.33); return fract((q.x + q.y) * q.z); }
  float vnoise(vec2 p){ vec2 i = floor(p), f = fract(p); f = f * f * (3. - 2. * f);
    return mix(mix(hash(i), hash(i + vec2(1., 0.)), f.x), mix(hash(i + vec2(0., 1.)), hash(i + vec2(1., 1.)), f.x), f.y); }
  float fbm(vec2 p){ float s = 0., a = .5; for (int i = 0; i < 5; i++) { s += a * vnoise(p); p *= 2.03; a *= .5; } return s; }`;

function passMat(fs, uniforms, extra = {}) {
  return new THREE.ShaderMaterial(Object.assign({ vertexShader: VS, fragmentShader: fs, uniforms, depthTest: false, depthWrite: false }, extra));
}

function initGL(canvas) {
  const r = new THREE.WebGLRenderer({ canvas, antialias: false, alpha: false, preserveDrawingBuffer: true, powerPreference: 'high-performance' });
  r.setPixelRatio(1);
  r.localClippingEnabled = true;
  r.shadowMap.enabled = true; r.shadowMap.type = THREE.PCFSoftShadowMap;
  r.outputEncoding = THREE.LinearEncoding; r.toneMapping = THREE.NoToneMapping;
  G3.r = r; G3.canvas = canvas;
  G3.qs = new THREE.Scene(); G3.qc = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
  G3.quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2)); G3.quad.frustumCulled = false; G3.qs.add(G3.quad);

  G3.matte = passMat(`${NOISE}
    uniform sampler2D tA, tB, tM; uniform float useMatte, edgeW, edgeNoise, seed; uniform vec3 edgeGlow; uniform vec2 res; varying vec2 vUv;
    void main(){
      vec3 a = texture2D(tA, vUv).rgb;
      if (useMatte < .5) { gl_FragColor = vec4(a, 1.); return; }
      vec3 b = texture2D(tB, vUv).rgb;
      float m = texture2D(tM, vUv).r;
      vec2 p = vUv * vec2(1920., 1080.) / 70.; // frame-relative, so the torn edge looks the same at any resolution
      float k = m + (fbm(p + seed) - .5) * edgeNoise;
      float mm = smoothstep(.5 - edgeW, .5 + edgeW, k);
      float e = exp(-pow((k - .5) / (edgeW * 2.2 + 1e-4), 2.)) * smoothstep(0., .12, m * (1. - m)); // glow only where the matte is in transition
      gl_FragColor = vec4(mix(a, b, mm) + edgeGlow * e * (.45 + .9 * fbm(p * 2.7 - seed)), 1.);
    }`, { tA: { value: null }, tB: { value: null }, tM: { value: null }, useMatte: { value: 0 }, edgeW: { value: 0.04 },
    edgeNoise: { value: 0.5 }, seed: { value: 0 }, edgeGlow: { value: new THREE.Vector3() }, res: { value: new THREE.Vector2() } });

  G3.bright = passMat(`uniform sampler2D t; uniform float thr, knee; varying vec2 vUv;
    void main(){ vec3 c = texture2D(t, vUv).rgb; float br = max(c.r, max(c.g, c.b));
      float s = clamp(br - thr + knee, 0., 2. * knee); s = s * s / (4. * knee + 1e-4);
      gl_FragColor = vec4(c * max(s, br - thr) / max(br, 1e-4), 1.); }`,
    { t: { value: null }, thr: { value: 1.35 }, knee: { value: 0.35 } });
  G3.down = passMat(`uniform sampler2D t; uniform vec2 px; varying vec2 vUv;
    void main(){ vec2 h = px * .5; vec3 s = texture2D(t, vUv).rgb * 4.;
      s += texture2D(t, vUv - h).rgb + texture2D(t, vUv + h).rgb + texture2D(t, vUv + vec2(h.x, -h.y)).rgb + texture2D(t, vUv - vec2(h.x, -h.y)).rgb;
      gl_FragColor = vec4(s / 8., 1.); }`, { t: { value: null }, px: { value: new THREE.Vector2() } });
  G3.up = passMat(`uniform sampler2D t, tPrev; uniform vec2 px; uniform float addPrev; varying vec2 vUv;
    void main(){ vec2 h = px * .5; vec3 s = vec3(0.);
      s += texture2D(t, vUv + vec2(-h.x * 2., 0.)).rgb + texture2D(t, vUv + vec2(h.x * 2., 0.)).rgb;
      s += texture2D(t, vUv + vec2(0., -h.y * 2.)).rgb + texture2D(t, vUv + vec2(0., h.y * 2.)).rgb;
      s += (texture2D(t, vUv + vec2(-h.x, h.y)).rgb + texture2D(t, vUv + vec2(h.x, h.y)).rgb + texture2D(t, vUv + vec2(h.x, -h.y)).rgb + texture2D(t, vUv + vec2(-h.x, -h.y)).rgb) * 2.;
      gl_FragColor = vec4(s / 12. + addPrev * texture2D(tPrev, vUv).rgb, 1.); }`,
    { t: { value: null }, tPrev: { value: null }, px: { value: new THREE.Vector2() }, addPrev: { value: 0 } });
  G3.grade = passMat(`${NOISE}
    uniform sampler2D tHdr, tBloom, tHud; uniform float bloomK, exposure, ca, vig, glitch, gSeed, hudOn, lift; uniform vec3 tint; varying vec2 vUv;
    // hue-preserving tone curve: linear up to .8, soft shoulder above, hot cores go white
    vec3 tone(vec3 c){
      float L = max(dot(c, vec3(.2126, .7152, .0722)), 1e-5);
      float Lm = L < .8 ? L : .8 + .2 * (1. - exp(-(L - .8) / .2));
      c *= Lm / L;
      float m = max(c.r, max(c.g, c.b));
      return m > 1. ? mix(c / m, vec3(1.), clamp((m - 1.) / 2.5, 0., 1.)) : c;
    }
    void main(){
      vec2 uv = vUv;
      if (glitch > 0.) {
        float row = floor(uv.y * 46.), r = hash(vec2(row, gSeed));
        if (r < .5 * glitch) uv.x += (hash(vec2(row, gSeed + 7.)) - .5) * .16 * glitch;
      }
      vec2 d = uv - .5; float k = ca + glitch * .012;
      vec3 c = vec3(texture2D(tHdr, uv + d * k).r, texture2D(tHdr, uv).g, texture2D(tHdr, uv - d * k).b);
      c += texture2D(tBloom, uv).rgb * bloomK;
      c = tone(c * exposure) * tint;
      c = c * (1. - lift) + lift * .06;
      c *= 1. - vig * dot(d, d) * 1.7;
      c = pow(max(c, 0.), vec3(1. / 2.2));
      vec4 h = texture2D(tHud, vUv); c = mix(c, h.rgb, h.a * hudOn);
      gl_FragColor = vec4(c, 1.);
    }`, { tHdr: { value: null }, tBloom: { value: null }, tHud: { value: null }, bloomK: { value: 0.8 }, exposure: { value: 1 },
    ca: { value: 0.002 }, vig: { value: 0.35 }, glitch: { value: 0 }, gSeed: { value: 0 }, hudOn: { value: 1 }, lift: { value: 0.02 },
    tint: { value: new THREE.Vector3(1, 1, 1) } });
  G3.acc = passMat('uniform sampler2D t; varying vec2 vUv; void main(){ gl_FragColor = vec4(texture2D(t, vUv).rgb, 1.); }',
    { t: { value: null } }, { blending: THREE.AdditiveBlending, transparent: true });
  G3.finish = passMat(`${NOISE}
    uniform sampler2D t; uniform float gain, time, grain, dust; uniform vec2 res, weave; varying vec2 vUv;
    void main(){
      // film finish in design pixels (1920×1080), so grain, dust, scratches and weave look the same at any
      // output size; at 4K each grain cell covers 2×2 pixels, and a downscale reproduces the 1080p grain
      const vec2 D = vec2(1920., 1080.);
      vec2 uv = vUv + weave / D;
      vec3 c = texture2D(t, uv).rgb * gain;
      vec2 px = vUv * D;
      float l = dot(c, vec3(.299, .587, .114));
      float n = (hashF(floor(px) + fract(time * 7.13) * 917.) - .5) + (hashF(floor(px * .5) + fract(time * 3.1) * 331.) - .5) * .6;
      c += n * grain * (.45 + .75 * (1. - l));
      // dust: sparse specks on a coarse grid, new every frame

    g.fillStyle = 'rgba(241,239,233,0.9)'; g.fillText(typed.slice(1), nx + textW(FN.noteFont, '*'), 50);
    if (t < CUE.fadeOut && (t % BEAT) < BEAT / 2) { g.fillStyle = COL.flamingo; g.fillRect(nx + textW(FN.noteFont, typed) + 6, 28, 12, 28); }
    Cl.note.material.map.needsUpdate = true;
    Cl.note.material.opacity = 1 - seg(t, CUE.fadeOut + 0.35, CUE.fadeOut + 0.7);
  }
}

// ═══ The director: which worlds, which matte, which look ═════════
const view = (w) => ({ scene: w.s, cam: w.cam });
function shot(t) {
  const base = { bloom: 0.55, exposure: 1.0, ca: 0.0022, vig: 0.4, glitch: glitchAmt(t) * 0.8, gSeed: Math.floor(t * 30), seed: t * 0.7, grain: 0.05, dust: 0.6 };
  if (t < CUE.wipe1) {
    updateDark(t);
    return Object.assign(base, { a: view(S3.dark), bloom: 0.7, dust: 0.9 });
  }
  if (t < CUE.grid) {
    updateDark(t); updateMake(t);
    return Object.assign(base, { a: view(S3.dark), b: view(S3.make), maskDraw: g => liquidWipe(g, seg(t, CUE.wipe1, CUE.grid), '#fff', 1), edgeGlow: [3.2, 2.2, 0.7], edgeW: 0.06, soft: 2 });
  }
  if (t < 9.7) { updateMake(t); return Object.assign(base, { a: view(S3.make), bloom: 0.45, dust: 0.35, vig: 0.3 }); }
  if (t < 10.0) {
    updateMake(t); updateMotion(t);
    const [sx, sy] = toScreen(S3.make.dot.position, S3.make.cam), rad = 2300 * Ez.inOutQuart(seg(t, CUE.iris, 10.0));
    return Object.assign(base, { a: view(S3.make), b: view(S3.motion), edgeGlow: [0.9, 0.9, 4.5], edgeW: 0.05, soft: 2,
      maskDraw: g => { g.fillStyle = '#fff'; g.beginPath(); g.arc(sx, sy, Math.max(rad, 0.1), 0, TAU); g.fill(); } });
  }
  if (t < 16) {
    updateMotion(t);
    const b = seg(t, CUE.build, CUE.collapse);
    return Object.assign(base, { a: view(S3.motion), bloom: 0.55 + 0.6 * b + 0.3 * pulse(t, CUE.slam, 6) + 1.5 * seg(t, 15.8, 16), exposure: 1 + 0.08 * pulse(t, CUE.slam, 8), ca: 0.0022 + 0.006 * b });
  }
  if (t < CUE.portal) { updateWithout(t); return Object.assign(base, { a: view(S3.without), bloom: 0.4, dust: 0.3, vig: 0.28, lift: 0 }); }
  if (t < 18) {
    updateWithout(t); updateCode(t);
    return Object.assign(base, { a: view(S3.without), b: view(S3.code), mask: { scene: S3.without.mask, cam: S3.without.cam }, soft: 1, edgeW: 0.05, edgeNoise: 0.7, edgeGlow: [5, 1.4, 2.4], dust: 0.3 });
  }
  if (t < CUE.wipe2 + 0.1) { updateCode(t); return Object.assign(base, { a: view(S3.code), bloom: 0.7, dust: 0.9 }); }
  if (t < 22) {
    updateCode(t); updateClaim(t, false);
    const u = Ez.inOutExpo(seg(t, CUE.wipe2 + 0.1, CUE.final[0])) * 1400;
    return Object.assign(base, { a: view(S3.code), b: view(S3.claim), edgeGlow: [1, 1, 5], edgeW: 0.05, soft: 2, maskDraw: g => { g.fillStyle = '#fff'; g.fillRect(-200, CY - u / 2, W + 400, u); } });
  }
  const cl = view(S3.claim);
  if (t >= CUE.curtain && t < CUE.curtain + 0.65) {
    return Object.assign(base, { a: Object.assign({}, cl, { pre: () => updateClaim(t, false) }), b: Object.assign({}, cl, { pre: () => updateClaim(t, true) }),
      maskDraw: g => liquidWipe(g, seg(t, CUE.curtain, CUE.curtain + 0.65), '#fff', -1), edgeGlow: [4, 1.2, 2], edgeW: 0.06, soft: 2 });
  }
  updateClaim(t, t >= CUE.curtain + 0.65);
  return Object.assign(base, { a: Object.assign({}, cl), bloom: t >= CUE.curtain + 0.65 ? 0.75 : 0.55, dust: t >= CUE.curtain + 0.65 ? 0.8 : 0.5 });
}

// ═══ Frame loop ═════════════════════════════════════════════════
function hud3(t) {
  const c = G3.hudCanvas, g = c.getContext('2d'), s = c.width / W;
  g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, c.width, c.height);
  g.setTransform(s, 0, 0, s, 0, 0);
  makeLabels(g, t);
  // in CODE the source layers run under the HUD corners: lay a soft ink scrim behind the text
  const sa = seg(t, 18.3, 18.55) * (1 - seg(t, 21.4, 21.6));
  if (sa > 0) for (const [y0, y1] of [[0, 130], [H, H - 120]]) {
    const gr = g.createLinearGradient(0, y0, 0, y1);
    gr.addColorStop(0, `rgba(17,17,22,${0.88 * sa})`); gr.addColorStop(1, 'rgba(17,17,22,0)');
    g.fillStyle = gr; g.fillRect(0, Math.min(y0, y1), W, Math.abs(y1 - y0));
  }
  hud(g, t);
  G3.hudTex.needsUpdate = true;
}
function renderFrame3(t, samples = 1, shutter = 0.5) {
  t = clamp(t, 0, DUR - 1e-4);
  FT = t; // typing is discrete: every sub-frame agrees on how many characters are out
  hud3(t);
  const r = G3.r;
  r.setRenderTarget(G3.accT); r.setClearColor(0x000000, 1); r.clear();
  let S = null;
  for (let k = 0; k < samples; k++) {
    const tk = clamp(samples > 1 ? t + ((k + 0.5) / samples - 0.5) * (shutter / FPS) : t, 0, DUR - 1e-4);
    S = shot(tk);
    renderShot(S);
    G3.acc.uniforms.t.value = G3.frame.texture; pass(G3.acc, G3.accT, false);
  }
  const Fu = G3.finish.uniforms;
  Fu.t.value = G3.accT.texture; Fu.gain.value = 1 / samples; Fu.time.value = t;
  Fu.grain.value = S.grain; Fu.dust.value = S.dust;
  Fu.weave.value.set(noise1(t * 24, 31) * 0.45, noise1(t * 24, 32) * 0.45);
  pass(G3.finish, null);
  FT = null;
}

// ═══ 3D · PLAYER ═════════════════════════════════════════════════
const SCENES3 = [
  { t: 0, mark: 'Drop', name: 'The drop', motion: 'A glowing dot carries its own light down onto raw concrete. The floor only exists where it lands.', sound: 'The same accelerating bounce fill as the 2D cut.' },
  { t: 2, mark: 'We', name: 'WE', motion: 'Mitosis in 3D, a swarm scattered in depth, then a word that extrudes its own thickness on a spring while the camera orbits.', sound: 'Plucks, sparkles, the lock.' },
  { t: 6, mark: 'Make', name: 'MAKE', motion: 'A liquid matte with a glowing seam opens onto a paper wall. Letters are drawn as glossy ink capsules that cast real shadows.', sound: 'Tuned woodblock clacks.' },
  { t: 10, mark: 'Motion', name: 'MOTION', motion: 'An iris matte from the dot. Extruded letters ride a glowing ribbon and leave echoes in depth. Then a dolly zoom stretches a marquee world.', sound: 'Groove, arpeggio, roll, tape stop.' },
  { t: 16, mark: 'Without', name: 'without', motion: 'A thin Bodoni surfacing out of fog. The o’s counter becomes a matte into the next scene, and the camera flies through it.', sound: 'Near silence and one glass ping.' },
  { t: 18, mark: 'Code', name: 'CODE', motion: 'Three depths of the film’s own source code. Extruded brackets glow butter; the letters decode, are cut by a flamingo blade, and tumble toward the lens.', sound: 'Glitches, locks, slash, bloops.' },
  { t: 22, mark: 'Claim', name: 'The claim', motion: 'Words rise through clipping-plane mattes at their baselines. A spotlight sweeps the lockup and its shadows cross the gritty wall.', sound: 'Five hits and the bounce fill again.' },
  { t: 26, mark: 'Footnote', name: 'The fine print', motion: 'The same world rendered in two looks and joined by a noise-edged curtain. The full stop grows six glowing arms.', sound: 'Sproing, typewriter, final blip.' },
];
const PRINCIPLES3 = [
  [0.15, 2.0, 'Motivated light', 'The dot carries its own light; the concrete only exists where it lands.'],
  [2.75, 3.96, 'Depth parallax', 'Particles scatter in z, then flatten onto the letters’ face.'],
  [3.96, 4.3, 'Extrusion as a reveal', 'The word grows its depth on a spring.'],
  [4.3, 5.5, 'Orbit', 'A slow camera arc proves it is real geometry.'],
  [5.62, 6.0, 'Noise matte', 'A liquid wipe with a gritty, glowing seam.'],
  [6.5, 8.4, 'Capsule strokes', 'Cylinders and spheres, drawn on like a pen, casting shadows.'],
  [9.7, 10.0, 'Iris matte', 'The next world opens out of the dot.'],
  [10.0, 11.9, 'Echoes in depth', 'Ghosts trail behind in time and in z.'],
  [14.0, 15.75, 'Dolly zoom', 'The lens widens as the camera closes in: the hero holds, the world stretches.'],
  [16.0, 17.3, 'Atmosphere', 'Letters surface out of fog.'],
  [17.35, 18.0, 'Portal matte', 'The o’s counter is a window into the next scene. Then we fly through it.'],
  [18.0, 20.0, 'Parallax field', 'Three layers of source code at different depths.'],
  [20.25, 21.2, 'Tumble', 'Letters fall toward the lens, spinning on all three axes.'],
  [21.8, 22.05, 'Band matte', 'Ultramarine opens from the blade.'],
  [22.0, 23.3, 'Clipping-plane masks', 'Words rise through an invisible floor at their baseline.'],
  [24.4, 26.2, 'Light sweep', 'A spotlight rakes the lockup; shadows travel across the wall.'],
  [26.2, 26.85, 'Curtain matte', 'One world, two looks, one noise-edged seam.'],
  [27.25, 28.2, 'Morph', 'The full stop grows six glowing arms.'],
];
const mmss = s => `0:${String(s).padStart(2, '0')}`;

async function prepare3() {
  const faces = [F.disp(100), F.serif(100), F.mono(100, 400), F.mono(100, 700)];
  await Promise.all(faces.map(f => document.fonts.load(f).catch(() => null)));
  await document.fonts.ready;
  PREP.forEach(fn => fn());
  loadFonts3(); buildMaterials();
  PREP3.forEach(fn => fn());
}

function startPlayer3() {
  const $ = s => document.querySelector(s);
  const canvas = $('#film'), stage = $('#stage'), playBtn = $('#play'), big = $('#bigplay');
  const tcEl = $('#tc'), bbEl = $('#barbeat'), scrub = $('#scrub'), head = $('#head'), waveC = $('#wave');
  const chip = $('#principle'), prinTog = $('#principles'), loopTog = $('#loop');
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) RO.shake = 0.25;
  let buffer = null, actx = null, src = null, playing = false, t0 = 0, offset = 25.8, clock = 0, started = false, lastT = -1, dirty = true;

  function size() {
    const r = stage.getBoundingClientRect(), dpr = Math.min(window.devicePixelRatio || 1, 2);
    const w = Math.max(480, Math.min(1920, Math.round((r.width * dpr) / 2) * 2));
    sizeGL(w, Math.round((w * 9) / 16)); dirty = true;
    const wr = scrub.getBoundingClientRect();
    waveC.width = Math.round(wr.width * dpr); waveC.height = Math.round(wr.height * dpr); drawWave();
  }
  function drawWave() {
    const g = waveC.getContext('2d'), w = waveC.width, h = waveC.height;
    g.clearRect(0, 0, w, h); g.fillStyle = 'rgba(241,239,233,0.05)'; g.fillRect(0, 0, w, h);
    for (let b = 0; b <= DUR / BAR; b++) { g.fillStyle = 'rgba(241,239,233,0.1)'; g.fillRect(Math.round((b * BAR / DUR) * w), 0, 1, h); }
    if (!buffer) return;
    const L = buffer.getChannelData(0), R = buffer.getChannelData(1), step = Math.floor(L.length / w);
    g.fillStyle = 'rgba(241,239,233,0.42)';
    for (let x = 0; x < w; x++) {
      let m = 0;
      for (let i = x * step; i < (x + 1) * step; i += 8) m = Math.max(m, Math.abs(L[i]), Math.abs(R[i]));
      const bh = Math.max(1, m * h * 0.9); g.fillRect(x, (h - bh) / 2, 1, bh);
    }
  }
  function now() {
    if (!playing) return offset;
    if (!actx) return clamp(offset + (performance.now() - clock) / 1000, 0, DUR);
    return clamp(actx.currentTime - t0 - (actx.outputLatency || actx.baseLatency || 0), 0, DUR);
  }
  function play() {
    if (playing) return;
    if (offset >= DUR - 0.02) offset = 0;
    started = true; big.hidden = true;
    try { if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === 'suspended') actx.resume(); } catch (e) { actx = null; }
    if (actx && buffer) { src = actx.createBufferSource(); src.buffer = buffer; src.connect(actx.destination); const at = actx.currentTime + 0.06; src.start(at, offset); t0 = at - offset; }
    else clock = performance.now();
    playing = true; playBtn.setAttribute('aria-label', 'Pause'); playBtn.dataset.state = 'playing';
  }
  function pause() {
    if (!playing) return;
    offset = now(); playing = false;
    if (src) { try { src.stop(); } catch (e) {} src = null; }
    playBtn.setAttribute('aria-label', 'Play'); playBtn.dataset.state = 'paused';
  }
  function seek(x, andPlay) { const was = playing || andPlay; pause(); offset = clamp(x, 0, DUR - 0.001); started = true; big.hidden = true; if (was) play(); }
  function ui(t) {
    tcEl.textContent = timecode(t);
    const bar = Math.floor(t / BAR) + 1, beat = Math.floor((t % BAR) / BEAT) + 1;
    bbEl.textContent = `BAR ${String(Math.min(bar, 15)).padStart(2, '0')} · ${beat}`;
    head.style.left = `${(t / DUR) * 100}%`;
    document.querySelectorAll('#cues li').forEach((li, i) => { const s = SCENES3[i], e = SCENES3[i + 1] ? SCENES3[i + 1].t : DUR; li.classList.toggle('on', started && t >= s.t && t < e); });
    let p = null;
    if (prinTog.checked && started) for (const q of PRINCIPLES3) if (t >= q[0] && t < q[1]) p = q;
    chip.hidden = !p;
    if (p) { chip.querySelector('b').textContent = p[2]; chip.querySelector('span').textContent = p[3]; }
  }
  function frame() {
    let t = now();
    if (playing && t >= DUR - 0.001) { if (loopTog.checked) { pause(); offset = 0; play(); t = 0; } else { pause(); offset = DUR; t = DUR; } }
    if (playing || t !== lastT || dirty) { renderFrame3(t, 1); lastT = t; dirty = false; }
    ui(t);
    requestAnimationFrame(frame);
  }
  const list = $('#cues');
  SCENES3.forEach((s, i) => {
    const e = SCENES3[i + 1] ? SCENES3[i + 1].t : DUR, li = document.createElement('li');
    li.innerHTML = `<button type="button" id="cue-${i}"><span class="tc">${mmss(s.t)} – ${mmss(e)}</span><span class="nm">${s.name}</span><span class="mo">${s.motion}</span><span class="so">${s.sound}</span></button>`;
    li.querySelector('button').addEventListener('click', () => { seek(s.t, true); stage.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); });
    list.appendChild(li);
  });
  const marks = $('#marks');
  SCENES3.forEach(s => { const m = document.createElement('span'); m.style.left = `${(s.t / DUR) * 100}%`; m.textContent = s.mark; marks.appendChild(m); });
  playBtn.addEventListener('click', () => (playing ? pause() : play()));
  big.addEventListener('click', () => seek(0, true));
  canvas.addEventListener('click', () => (started ? (playing ? pause() : play()) : seek(0, true)));
  let drag = false;
  const toT = e => { const r = scrub.getBoundingClientRect(); return clamp((e.clientX - r.left) / r.width) * DUR; };
  scrub.addEventListener('pointerdown', e => { drag = true; scrub.setPointerCapture(e.pointerId); const was = playing; pause(); offset = toT(e); started = true; big.hidden = true; scrub.dataset.resume = was ? '1' : ''; });
  scrub.addEventListener('pointermove', e => { if (drag) offset = toT(e); });
  scrub.addEventListener('pointerup', () => { drag = false; if (scrub.dataset.resume) play(); });
  scrub.addEventListener('keydown', e => { if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') { e.preventDefault(); seek(now() + (e.key === 'ArrowLeft' ? -BEAT : BEAT)); } });
  document.addEventListener('keydown', e => {
    if (e.target.closest('input, button, [role="slider"]') && e.key !== ' ') return;
    if (e.key === ' ') { e.preventDefault(); playing ? pause() : started ? play() : seek(0, true); }
    else if (e.key === 'ArrowLeft') seek(now() - BEAT);
    else if (e.key === 'ArrowRight') seek(now() + BEAT);
    else if (e.key === 'Home') seek(0);
  });
  new ResizeObserver(size).observe(stage);
  size();
  requestAnimationFrame(frame);
  renderSoundtrack().then(b => { buffer = b; drawWave(); big.disabled = false; big.querySelector('span').textContent = 'Play with sound'; })
    .catch(() => { big.disabled = false; big.querySelector('span').textContent = 'Play (no sound)'; });
}

window.MWC3 = { prepare3, initGL, sizeGL, renderFrame3, renderSoundtrack, wavBytes, RO, DUR, FPS, W, H, G3 };
if (!window.MWC_HEADLESS) { initGL(document.querySelector('#film')); prepare3().then(startPlayer3); }
})();
</script>
